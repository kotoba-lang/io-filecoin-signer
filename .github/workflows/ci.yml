name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:lint
      - run: clojure -M:test

  cljs:
    # Not redundant with the JVM job, and less so here than anywhere else in
    # this family: eth-crypto implements secp256k1 twice — BigInteger and
    # javax.crypto on one side, js/BigInt and a hand-written SHA-256 on the
    # other. RFC-6979 makes the signature deterministic, so running the same
    # pinned bytes on both is a cross-implementation check, not a repeat.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: npm install -g nbb
      - run: npm ci
      - run: nbb --classpath "$(clojure -A:cljs -Spath)" scripts/verify-cljs.cljk
